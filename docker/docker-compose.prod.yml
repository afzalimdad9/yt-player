version: "3.9"

services:
  # For production, you'd use AWS S3 instead of MinIO
  # Remove minio and minio-init services and use actual S3-env vars

  api:
    environment:
      STORAGE_ENDPOINT: https://s3.amazonaws.com
      STORAGE_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
      STORAGE_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
      STORAGE_BUCKET: ${S3_BUCKET}
      STORAGE_REGION: ${AWS_REGION}
      STORAGE_PUBLIC_URL: https://${S3_BUCKET}.s3.amazonaws.com
      NODE_ENV: production

  worker:
    environment:
      STORAGE_ENDPOINT: https://s3.amazonaws.com
      STORAGE_ACCESS_KEY: ${AWS_ACCESS_KEY_ID}
      STORAGE_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY}
      STORAGE_BUCKET: ${S3_BUCKET}
      STORAGE_REGION: ${AWS_REGION}
      STORAGE_PUBLIC_URL: https://${S3_BUCKET}.s3.amazonaws.com
      NODE_ENV: production

  # Add Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./nginx/ssl:/etc/nginx/ssl
    depends_on:
      - api
      - web
