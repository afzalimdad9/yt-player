version: "3.9"

services:
  # =====================
  # PostgreSQL Database
  # =====================
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ytplayer
      POSTGRES_PASSWORD: ytplayer
      POSTGRES_DB: ytplayer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ytplayer"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =====================
  # Redis + BullMQ
  # =====================
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # =====================
  # MinIO (S3-compatible storage)
  # =====================
  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"  # S3 API
      - "9001:9001"  # Console
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO Bucket Initializer
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin;
      mc mb local/yt-player --ignore-existing;
      mc anonymous set public local/yt-player;
      echo 'MinIO bucket initialized';
      "

  # =====================
  # API Server
  # =====================
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile.api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      DATABASE_URL: postgresql://ytplayer:ytplayer@postgres:5432/ytplayer
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET: yt-player
      STORAGE_PUBLIC_URL: http://localhost:9000/yt-player
      API_PORT: 4000
      API_HOST: 0.0.0.0
      API_CORS_ORIGIN: http://localhost:5173
      NODE_ENV: production
      TEMP_DIR: /tmp/yt-player
      WHISPER_MODEL: base
    volumes:
      - pipeline_temp:/tmp/yt-player
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_started

  # =====================
  # Worker Process
  # =====================
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile.worker
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://ytplayer:ytplayer@postgres:5432/ytplayer
      REDIS_HOST: redis
      REDIS_PORT: 6379
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_BUCKET: yt-player
      STORAGE_PUBLIC_URL: http://localhost:9000/yt-player
      NODE_ENV: production
      TEMP_DIR: /tmp/yt-player
      WHISPER_MODEL: base
    volumes:
      - pipeline_temp:/tmp/yt-player
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  # =====================
  # Frontend (for prod)
  # =====================
  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile.web
    restart: unless-stopped
    ports:
      - "5173:80"
    environment:
      VITE_API_URL: http://localhost:4000
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
  minio_data:
  pipeline_temp:
